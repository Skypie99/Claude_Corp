<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>og-image template</title>
  <!-- Template for /og-image.png (1200 x 630). Serve the repository root over
       HTTP, open /tools/og-image.html in a headless browser at 1200 x 630 with
       reduced motion, and capture the viewport. Artwork comes from tools/atlas.mjs. -->
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .card { position: relative; width: 1200px; height: 630px; padding: 60px 0 52px 64px; display: grid; grid-template-columns: 500px 1fr; gap: 40px; }
    .card-copy { display: flex; flex-direction: column; }
    .card .kicker { margin-bottom: 24px; font-size: 15px; }
    .card h1 { font-size: 64px; line-height: 1.02; max-width: none; }
    .card-url { margin-top: auto; font-family: var(--mono); font-size: 18px; letter-spacing: 0.04em; color: var(--ink-meta); }
    .card-art { position: relative; }
    .card .well { position: absolute; left: 0; top: 0; right: 0; bottom: -52px; margin: 0; padding: 0 44px 52px 30px; border-radius: 10px 0 0 0; display: flex; align-items: center; }
    .card .plate { width: 100%; }
    .card .plate { max-width: none; padding: 22px 24px 18px; }
    .card .plate-head { padding-bottom: 10px; }
    .card .plate-caption { margin-top: 12px; padding-top: 12px; font-size: 17px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-copy">
      <p class="label kicker"><span class="dot" aria-hidden="true"></span>Claude Corp · A SkyPi Studio system</p>
      <h1>Fifteen AI roles work in parallel. <span class="accent">One person decides what ships.</span></h1>
      <p class="card-url">claudecorp.skypistudio.com</p>
    </div>
    <div class="card-art">
